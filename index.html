<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank God For Drugs</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Album Title</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Thank God For Drugs",
  cover: "tgfdcover.jpg",
  songs: [
      { file: "iamnothome.mp3", title: "I Am Not Home", artist: "Kanye West" },
      { file: "perfectbitch.mp3", title: "Perfect Bitch", artist: "Kanye West, Justxn Paul" },
      { file: "goodthingsdontlast.mp3", title: "Good Things Don't Last", artist: "Kanye West" },
      { file: "emotionless.mp3", title: "Emotionless", artist: "Kanye West, Chantal Kreviazuk, Kendrick Lamar" },
      { file: "louder.mp3", title: "LOUDER!", artist: "Kanye West, Chantal Kreviazuk, Pusha T" },
      { file: "nononono.mp3", title: "No No No No", artist: "Kanye West, Travis Scott, 2 Chainz, The-Dream" },
      { file: "hollywood.mp3", title: "Hollywood", artist: "Kanye West, Justxn Paul" },
      { file: "wow!.mp3", title: "WOW!", artist: "Kanye West, Justxn Paul" },
      { file: "blkkkskinhead.mp3", title: "BLKKK SKINHEAD", artist: "Kanye West" },
      { file: "bloodontheleaves.mp3", title: "Blood On The Leaves", artist: "Kanye West" },
      {
        title: "Awesome",
        versions: [
      {
        version: "V11",
        file: "awesome.mp3",
        artist: "Kanye West"
      },
      {
        version: "V8",
        file: "awesomev8.mp3",
        artist: "Kanye West, Charlie Wilson, Stevie Wonder"
      }
    ]
  },
      { file: "nobodytolove.mp3", title: "Nobody To Love", artist: "Kanye West, Charlie Wilson" },
      { file: "overture.mp3", title: "Overture", artist: "Kanye West" },
      { file: "whyfeelbad.mp3", title: "Why Feel Bad?", artist: "Kanye West, The Weeknd" },
      { file: "bound.mp3", title: "Bound", artist: "Kanye West" },
      { file: "cantgetoverme.mp3", title: "Can't Get Over Me", artist: "Kanye West, Tony Williams, Bon Iver, The-Dream" },
      { file: "battucada.mp3", title: "Battucada", artist: "Kanye West" },
      { file: "ionlyhaveyees.mp3", title: "I Only Have Eyes", artist: "Kanye West, The Weeknd" },
      { file: "paddedwalls.mp3", title: "Padded Walls", artist: "Kanye West, Azealia Banks" },
      { file: "guilttripog.mp3", title: "Guilt Trip", artist: "Kanye West, Kid Cudi" },
      { file: "newslavesv2.mp3", title: "New Slaves", artist: "Kanye West, Frank Ocean" },
      { file: "onsite.mp3", title: "On Site", artist: "Kanye West" },
      { file: "lord.mp3", title: "Lord", artist: "Kanye West, The Weeknd" },
      { file: "coldyeezusremix.mp3", title: "Cold (Remix)", artist: "Kanye West, DJ Khaled" }
  ]
};

// BACK BUTTON (PUT MAIN REPO LINK HERE)
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/"; // <-- paste main library repo URL here
}

// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;

buildSongs();

// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach(version => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);

        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);

    }

  });

}

// PLAY SONG
function playSong(i) {

  // Skip version groups
  while (
    i < currentAlbum.songs.length &&
    currentAlbum.songs[i].versions
  ) {
    i++;
  }

  // Loop back to beginning if needed
  if (i >= currentAlbum.songs.length) {
    i = 0;

    while (
      i < currentAlbum.songs.length &&
      currentAlbum.songs[i].versions
    ) {
      i++;
    }
  }

  currentIndex = i;

  const song = currentAlbum.songs[i];

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song, currentAlbum);
}

function updateMediaSession(song) {
  if (!('mediaSession' in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      { src: currentAlbum.cover, sizes: "512x512", type: "image/jpg" }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex - 1 + currentAlbum.songs.length) % currentAlbum.songs.length;
    playSong(currentIndex);
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {
    if (!currentAlbum) return;
    currentIndex = (currentIndex + 1) % currentAlbum.songs.length;
    playSong(currentIndex);
  });
}

  if ("mediaSession" in navigator) {

  navigator.mediaSession.setActionHandler("play", async () => {
    await audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    audio.pause();
  });

}

function togglePlay() {
  if (audio.paused) {
    audio.play();
  } else {
    audio.pause();
  }
}

  audio.addEventListener("play", () => {
  document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
});

audio.addEventListener("pause", () => {
  document.getElementById("playPauseBtn").innerText = "▶️ Play";
});

window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  audio.addEventListener("ended", () => {
  if (!currentAlbum) return;

  const list = getPlayableSongs();

  const currentSong = currentAlbum.songs[currentIndex];
  const nextIndex = list.indexOf(currentSong) + 1;

  if (nextIndex < list.length) {
    const nextSong = list[nextIndex];

    const realIndex = currentAlbum.songs.indexOf(nextSong);
    playSong(realIndex);
  } else {
    playSong(currentAlbum.songs.indexOf(list[0]));
  }
});

  // expose audio globally so playSong can use it safely
  window.audio = audio;
});

function getPlayableSongs() {
  const list = [];

  currentAlbum.songs.forEach(song => {
    if (song.versions) {
      // skip the container entirely
      return;
    }
    list.push(song);
  });

  return list;
}
  
</script>

</body>
</html>
