<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Thank God For Drugs</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #111;
      color: white;
      text-align: center;
    }

    #player {
      padding: 20px;
    }

    #cover {
      width: 250px;
      height: 250px;
      object-fit: cover;
      margin-top: 10px;
      border-radius: 10px;
    }

    .song {
      padding: 10px;
      margin: 5px auto;
      width: 60%;
      background: #222;
      cursor: pointer;
      border-radius: 5px;
    }

    .song:hover {
      background: #333;
    }

    button {
      margin: 10px;
      padding: 10px 15px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<div id="player">

  <!-- BACK BUTTON -->
  <button onclick="goBack()">⬅ Back to Library</button>

  <!-- ALBUM INFO -->
  <h1 id="albumTitle">Thank God For Drugs</h1>
  <img id="cover" src="" alt="cover">

  <!-- SONG LIST -->
  <div id="songs"></div>

</div>

<audio id="audio"></audio>

<button id="playPauseBtn" onclick="togglePlay()">▶️ Play</button>

<script>

let currentAlbum = {
  name: "Thank God For Drugs",
  cover: "tgfdcover.jpg",
  songs: [
      { file: "iamnothome.mp3", title: "I Am Not Home", artist: "Kanye West" },
      { file: "perfectbitch.mp3", title: "Perfect Bitch", artist: "Kanye West, Justxn Paul" },
      { file: "goodthingsdontlast.mp3", title: "Good Things Don't Last", artist: "Kanye West" },
      { file: "emotionless.mp3", title: "Emotionless", artist: "Kanye West, Chantal Kreviazuk, Kendrick Lamar" },
      { file: "louder.mp3", title: "LOUDER!", artist: "Kanye West, Chantal Kreviazuk, Pusha T" },
      { file: "nononono.mp3", title: "No No No No", artist: "Kanye West, Travis Scott, 2 Chainz, The-Dream" },
      { file: "hollywood.mp3", title: "Hollywood", artist: "Kanye West, Justxn Paul" },
      { file: "wow!.mp3", title: "WOW!", artist: "Kanye West, Justxn Paul" },
      { file: "blkkkskinhead.mp3", title: "BLKKK SKINHEAD", artist: "Kanye West" },
      { file: "bloodontheleaves.mp3", title: "Blood On The Leaves", artist: "Kanye West" },
      {
        title: "Awesome",
        versions: [
      {
        version: "V8",
        file: "awesomev8.mp3",
        artist: "Kanye West, Charlie Wilson, Stevie Wonder"
      },
      {
        version: "V11",
        file: "awesome.mp3",
        artist: "Kanye West"
      },
    ]
  },
      { file: "nobodytolove.mp3", title: "Nobody To Love", artist: "Kanye West, Charlie Wilson" },
      { file: "overture.mp3", title: "Overture", artist: "Kanye West" },
      { file: "whyfeelbad.mp3", title: "Why Feel Bad?", artist: "Kanye West, The Weeknd" },
      { file: "bound.mp3", title: "Bound", artist: "Kanye West" },
      { file: "cantgetoverme.mp3", title: "Can't Get Over Me", artist: "Kanye West, The WRLDFMS Tony Williams, Bon Iver, The-Dream" },
      { file: "battucada.mp3", title: "Battucada", artist: "Kanye West" },
      { file: "ionlyhaveyees.mp3", title: "I Only Have Eyes", artist: "Kanye West, The Weeknd" },
      { file: "paddedwalls.mp3", title: "Padded Walls", artist: "Kanye West, Azealia Banks" },
      { file: "guilttripog.mp3", title: "Guilt Trip", artist: "Kanye West, Kid Cudi" },
      { file: "newslavesv2.mp3", title: "New Slaves", artist: "Kanye West, Frank Ocean" },
      { file: "onsite.mp3", title: "On Site", artist: "Kanye West" },
      { file: "lord.mp3", title: "Lord", artist: "Kanye West, The Weeknd" },
      { file: "blackskinheadremix.mp3", title: "Black Skinhead (Remix)", artist: "Kanye West, Miley Cyrus, Travis Scott" },
      { file: "talktome.mp3", title: "Talk To Me", artist: "Kanye West, Travis Scott, Bon Iver" },
      { file: "holdmyliquor.mp3", title: "Hold My Liquor", artist: "Kanye West, Chief Keef, Bon Iver" },
  ]
};

// BACK BUTTON
function goBack() {
  window.location.href = "https://peace345.github.io/Ye-Unreleased-Archive/";
}


// VARIABLES
let currentIndex = 0;
let currentVersionIndex = null;


// LOAD ALBUM
document.getElementById("albumTitle").innerText = currentAlbum.name;
document.getElementById("cover").src = currentAlbum.cover;


// BUILD SONG LIST
function buildSongs() {
  const songsDiv = document.getElementById("songs");
  songsDiv.innerHTML = "";

  currentAlbum.songs.forEach((song, i) => {

    // SONG WITH MULTIPLE VERSIONS
    if (song.versions) {

      const group = document.createElement("div");
      group.className = "song";

      group.innerHTML = `<strong>${song.title} ▼</strong>`;

      group.onclick = () => {

        // Prevent duplicates
        if (group.dataset.opened) return;
        group.dataset.opened = true;

        song.versions.forEach((version, versionIndex) => {

          const div = document.createElement("div");
          div.className = "song";

          div.innerHTML = `
            <div style="display:flex; align-items:center;">
              <div style="width:60px;">
                <strong>${version.version}</strong>
              </div>

              <div style="flex:1; text-align:center;">
                <strong>${song.title}</strong><br>
                <small>${version.artist}</small>
              </div>
            </div>
          `;

          div.onclick = (e) => {
            e.stopPropagation();

            currentIndex = i;
            currentVersionIndex = versionIndex;

            window.audio.src = version.file;
            window.audio.play();

            updateMediaSession({
              title: song.title,
              artist: version.artist
            });
          };

          group.after(div);
        });

      };

      songsDiv.appendChild(group);

    }

    // NORMAL SONG
    else {

      const div = document.createElement("div");
      div.className = "song";

      div.innerHTML = `
        <strong>${song.title}</strong><br>
        <small>${song.artist || ""}</small>
      `;

      div.onclick = () => playSong(i);

      songsDiv.appendChild(div);
    }

  });
}


// PLAY SONG
function playSong(i, versionIndex = null) {

  currentIndex = i;

  const song = currentAlbum.songs[i];

  // VERSION GROUP
  if (song.versions) {

    // Start with the LOWEST version.
    // Your array is highest → lowest,
    // so the lowest version is the LAST item.
    if (versionIndex === null) {
      versionIndex = song.versions.length - 1;
    }

    currentVersionIndex = versionIndex;

    const version = song.versions[versionIndex];

    window.audio.src = version.file;
    window.audio.play();

    updateMediaSession({
      title: song.title,
      artist: version.artist
    });

    return;
  }


  // NORMAL SONG
  currentVersionIndex = null;

  window.audio.src = song.file;
  window.audio.play();

  updateMediaSession(song);
}


// MEDIA SESSION
function updateMediaSession(song) {

  if (!("mediaSession" in navigator)) return;

  navigator.mediaSession.metadata = new MediaMetadata({
    title: song.title,
    artist: song.artist,
    album: currentAlbum.name,
    artwork: [
      {
        src: currentAlbum.cover,
        sizes: "512x512",
        type: "image/jpeg"
      }
    ]
  });

  navigator.mediaSession.setActionHandler("play", () => {
    window.audio.play();
  });

  navigator.mediaSession.setActionHandler("pause", () => {
    window.audio.pause();
  });

  navigator.mediaSession.setActionHandler("previoustrack", () => {

    if (!currentAlbum) return;

    // If currently playing a version, go to the previous version
    if (
      currentVersionIndex !== null &&
      currentVersionIndex > 0
    ) {
      playSong(currentIndex, currentVersionIndex - 1);
      return;
    }

    // Otherwise go to previous album track
    if (currentIndex > 0) {
      playSong(currentIndex - 1);
    } else {
      playSong(currentAlbum.songs.length - 1);
    }
  });

  navigator.mediaSession.setActionHandler("nexttrack", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];

    // If playing a version, go to the next version
    if (
      song.versions &&
      currentVersionIndex !== null &&
      currentVersionIndex < song.versions.length - 1
    ) {
      playSong(currentIndex, currentVersionIndex + 1);
      return;
    }

    // Otherwise go to next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      playSong(0);
    }
  });
}


// PLAY / PAUSE BUTTON
function togglePlay() {

  if (window.audio.paused) {
    window.audio.play();
  } else {
    window.audio.pause();
  }
}


// INITIALIZE AUDIO
window.addEventListener("DOMContentLoaded", () => {

  const audio = document.getElementById("audio");

  // Make audio available to the rest of the script
  window.audio = audio;


  // PLAY BUTTON UI
  audio.addEventListener("play", () => {
    document.getElementById("playPauseBtn").innerText = "⏸️ Pause";
  });


  // PAUSE BUTTON UI
  audio.addEventListener("pause", () => {
    document.getElementById("playPauseBtn").innerText = "▶️ Play";
  });


  // AUTOPLAY THROUGH ALBUM
  audio.addEventListener("ended", () => {

    if (!currentAlbum) return;

    const song = currentAlbum.songs[currentIndex];


    // VERSION GROUP
    if (
      song.versions &&
      currentVersionIndex !== null
    ) {

      // Your versions are stored:
      // V6 → V5 → V4 → V1
      //
      // So autoplay moves backward through the array:
      // V1 → V4 → V5 → V6

      const nextVersion = currentVersionIndex - 1;

      if (nextVersion >= 0) {
        playSong(currentIndex, nextVersion);
        return;
      }
    }


    // FINISHED ALL VERSIONS
    // Move to the next album track
    if (currentIndex < currentAlbum.songs.length - 1) {
      playSong(currentIndex + 1);
    } else {
      // End of album → restart album
      playSong(0);
    }

  });


  // BUILD THE SONG LIST
  buildSongs();

});

</script>

</body>
</html>
